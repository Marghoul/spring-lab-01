spring.application.name=spring-lab-01
app.owner=Akhmetkali Margulan, IS-2501
# Tests use a fresh in-memory database; Flyway builds the schema every run
spring.datasource.url=jdbc:h2:mem:txlab;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
logging.level.org.flywaydb=INFO
