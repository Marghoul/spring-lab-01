<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <h1>Books</h1>
    <table>
        <tr><th>ID</th><th>Title</th><th>Genre</th><th>Year</th><th></th></tr>
        <tr th:each="b : ${books}">
            <td th:text="${b.id}">1</td>
            <td><a th:href="@{/books/{id}(id=${b.id})}" th:text="${b.title}">Title</a></td>
            <td th:text="${b.genre}">NOVEL</td>
            <td th:text="${b.year}">2020</td>
            <td>
                <form sec:authorize="hasRole('ADMIN')" th:action="@{/books/{id}/delete(id=${b.id})}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </table>

    <!-- hiding is a courtesy, not a control: the server rules still protect POST /books -->
    <div class="card" sec:authorize="hasRole('ADMIN')">
        <h3>Add a book</h3>
        <form th:action="@{/books}" method="post">
            <input name="title" placeholder="Title" required>
            <select name="genre">
                <option th:each="g : ${genres}" th:value="${g}" th:text="${g}">NOVEL</option>
            </select>
            <input name="year" type="number" placeholder="Year" required>
            <button type="submit">Create</button>
        </form>
    </div>
</main>
</body>
</html>
