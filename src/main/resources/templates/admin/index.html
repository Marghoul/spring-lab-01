<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administration</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <h1>Administration</h1>

    <h3>Users</h3>
    <table>
        <tr><th>ID</th><th>Username</th><th>Password hash (BCrypt)</th><th>Enabled</th><th>Roles</th></tr>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.username}">user</td>
            <td><code th:text="${u.passwordHash}">$2a$10$...</code></td>
            <td th:text="${u.enabled}">true</td>
            <td th:text="${u.roles}">[USER]</td>
        </tr>
    </table>

    <h3>Authentication audit (variant 10, last 20 events)</h3>
    <table>
        <tr><th>ID</th><th>Time</th><th>Username</th><th>Event</th><th>Result</th><th>Reason</th><th>IP</th></tr>
        <tr th:each="a : ${audit}">
            <td th:text="${a.id}">1</td>
            <td th:text="${#temporals.format(a.createdAt, 'yyyy-MM-dd HH:mm:ss')}">time</td>
            <td th:text="${a.username}">user</td>
            <td th:text="${a.eventType}">AuthenticationSuccessEvent</td>
            <td th:class="${a.success} ? 'ok' : 'fail'" th:text="${a.success} ? 'SUCCESS' : 'FAILURE'">SUCCESS</td>
            <td th:text="${a.reason}"></td>
            <td th:text="${a.remoteAddr}">127.0.0.1</td>
        </tr>
    </table>
</main>
</body>
</html>
