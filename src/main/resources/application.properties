spring.application.name=spring-lab-01
server.port=8080
app.owner=Akhmetkali Margulan, IS-2501
logging.level.web=INFO

# Lab 7: H2 file database so that a restart keeps flyway_schema_history (Task E)
spring.datasource.url=jdbc:h2:file:./data/txlab;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Schema is owned by Flyway, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
logging.level.org.flywaydb=INFO
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
